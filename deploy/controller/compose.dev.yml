services:
  initialise-data:
    image: busybox:1.37
    command: ["sh", "-c", "chown 65532:65532 /var/lib/thinpi && chmod 0700 /var/lib/thinpi"]
    volumes:
      - thinpi-dev-data:/var/lib/thinpi
    restart: "no"

  controller:
    build:
      context: ../../controller
      args:
        VERSION: dev
    command: ["serve", "--dev", "--listen", "0.0.0.0:8080", "--database", "/var/lib/thinpi/thinpi.db"]
    restart: unless-stopped
    depends_on:
      initialise-data:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - thinpi-dev-data:/var/lib/thinpi
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "/usr/bin/thinpi-controller", "healthcheck", "--url", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  thinpi-dev-data:
